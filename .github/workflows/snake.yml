# Redraws the contribution-graph snake every day and pushes it to the `output` branch.
name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # The built-in token can't see private-repo contributions; a personal token in SNAKE_TOKEN can.
          github_token: ${{ secrets.SNAKE_TOKEN || github.token }}
          outputs: |
            dist/snake.svg?color_snake=#a4161a&color_dots=#ebedf0,#ffc9c9,#ff8787,#e5383b,#a4161a
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff6b6b&color_dots=#161b22,#4a0d0f,#7a1315,#b81d22,#e5383b

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
